# 任务配置文件
# 定义小说生成工作流中的各个任务
# 任务之间的依赖关系通过 context 参数控制

# 历史上下文分析任务（仅在有历史章节时执行）
historical_context_analysis:
  description: |
    分析历史章节，提取关键信息：
    
    历史章节：{history_chapters}
    
    输出：
    1. 核心情节概要（100字内）
    2. 主要角色当前状态（50字内）
  expected_output: 历史上下文摘要
  agent: historical_context_analyst
  # 输入参数：history_chapters
  # 无前置任务

# 对话分析任务
dialogue_analysis:
  description: |
    分析对话内容：
    
    对话：{prompt}
    世界观：{worldview}
    核心人物：{master_sitting}
    其余角色：{main_characters}
    玩家背景：{background}
    
    输出：
    1. 核心情节要点（50字内）
    2. 情感基调（20字内）
  expected_output: 对话分析报告
  agent: dialogue_analyst
  # 输入参数：prompt、worldview、master_sitting、main_characters、background
  # 无前置任务

# 剧情规划任务
story_planning:
  description: |
    根据历史上下文分析和对话分析结果，规划章节叙事：
    
    对话内容：{prompt}
    
    输出格式：
    1. 章节标题（10字内）
    2. 情节节点（3-5个，每个20字内）
  expected_output: 剧情规划方案
  agent: story_planner
  # 输入参数：历史上下文分析结果、对话分析结果、prompt
  # 前置任务：historical_context_analysis（如果有）、dialogue_analysis

# 写作任务
writing:
  description: |
    根据剧情规划创作章节：
    
    对话：{prompt}
    
    要求：
    1. 首行用 # 标题
    2. 紧扣对话内容创作
    3. 控制在500字内
  expected_output: 章节草稿
  agent: writer
  # 输入参数：剧情规划结果、prompt
  # 前置任务：story_planning

# 修饰润色任务
polishing:
  description: |
    润色章节内容：
    
    处理：
    1. 优化语言流畅度
    2. 确保 Markdown 格式
  expected_output: 最终章节
  agent: polisher
  # 输入参数：写作结果
  # 前置任务：writing
