# 任务配置文件
# 定义小说生成工作流中的各个任务
# 任务之间的依赖关系通过 context 参数控制

# 历史上下文分析任务（仅在有历史章节时执行）
historical_context_analysis:
  description: |
    分析历史章节，提取关键信息，确保风格一致性：
    
    历史章节：{history_chapters}
    
    输出要求：
    1. 核心情节概要（100字内）
    2. 主要角色当前状态（50字内）
    3. 语言风格特点（用于保持一致性）
  expected_output: 历史上下文摘要
  agent: historical_context_analyst
  # 输入参数：history_chapters
  # 无前置任务

# 对话分析任务
dialogue_analysis:
  description: |
    分析对话内容，确保对话是创作的核心素材：
    
    对话：{prompt}
    世界观：{worldview}（仅作为辅助参考）
    核心人物：{master_sitting}（仅作为辅助参考）
    其余角色：{mc_text}（仅作为辅助参考）
    玩家背景：{background}（仅作为辅助参考）
    
    重要原则：
    - 对话内容是创作的核心和基础，必须完整保留其情节发展和人物互动
    - 世界观、人物设定等信息仅作为辅助参考，用于确保风格一致，不应喧宾夺主
    
    输出要求：
    1. 核心情节要点（50字内，紧扣对话内容）
    2. 情感基调（20字内）
    3. 需要补充的场景描写要点（30字内）
  expected_output: 对话分析报告
  agent: dialogue_analyst
  # 输入参数：prompt、worldview、master_sitting、mc_text、background
  # 无前置任务

# 剧情规划任务
story_planning:
  description: |
    根据历史上下文分析和对话分析结果，规划章节叙事：
    
    对话内容：{prompt}
    
    核心原则：
    - 创作重点是忠实还原并扩展用户提供的对话内容
    - 将对话自然地融入故事叙述中，适当补充场景描写和人物心理
    - 设定相关但与对话无关的内容可简要带过
    
    输出格式：
    1. 章节标题（10字内，简洁有力，直接点明故事核心）
    2. 情节节点（3-5个，每个20字内，紧密围绕对话内容）
    3. 叙事方式说明（30字内，如何将对话融入故事）
  expected_output: 剧情规划方案
  agent: story_planner
  # 输入参数：历史上下文分析结果、对话分析结果、prompt
  # 前置任务：historical_context_analysis（如果有）、dialogue_analysis

# 写作任务
writing:
  description: |
    根据剧情规划创作章节，严格遵循输出要求：
    
    对话：{prompt}
    
    核心要求：
    1. 主体内容必须紧密围绕用户提供的对话内容展开创作
    2. 语言风格与世界观一致，自然流畅，避免冗余
    3. 仅输出小说内容，无任何额外引导语（如「故事开始了」）或说明文字
    4. 对话相关内容应详细展开，场景、心理、动作等描写需与对话融合
    5. 设定相关但与对话无关的内容可简要带过
    
    格式要求：
    1. 第一段必须是章节标题，使用Markdown一级标题（# 标题内容）
    2. 全程遵循Markdown语法，标题、段落、对话层级清晰
    3. 无杂乱排版，可直接复制使用
  expected_output: 章节草稿
  agent: writer
  # 输入参数：剧情规划结果、prompt
  # 前置任务：story_planning

# 修饰润色任务
polishing:
  description: |
    润色章节内容，确保最终输出质量：
    
    处理重点：
    1. 优化语言流畅度，使表达更自然
    2. 确保Markdown格式规范，无杂乱排版
    3. 保持与历史章节风格统一
    4. 确保对话相关内容详细展开，场景、心理、动作描写与对话融合
    5. 删除冗余内容，优化语言表达
    6. 确保标题、段落、对话层级清晰
    
    最终输出要求：
    - 第一段必须是Markdown一级标题（# 标题内容）
    - 全程遵循Markdown语法
    - 无任何额外引导语或说明文字
    - 可直接复制使用
  expected_output: 最终章节
  agent: polisher
  # 输入参数：写作结果
  # 前置任务：writing
